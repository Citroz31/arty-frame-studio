[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "arty-frame-studio"
version = "0.1.0"
description = "Pilotage série et chronogrammes pour FPGA Arty A7-100T, sans Vivado"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["flet[desktop]==0.28.3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-pyserial>=3.5", "build>=1.2,<2"]

[project.scripts]
arty-frame-studio = "arty_frame_studio.app:run"
arty-frame = "arty_frame_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arty_frame_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/arty_frame_studio"]

[[tool.mypy.overrides]]
module = ["flet.*"]
follow_imports = "skip"
